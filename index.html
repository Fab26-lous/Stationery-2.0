<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stationery POS</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
    }

    .card, .panel, .store-card, .main-card, .modal-content {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hidden { display: none !important; }

    .header {
      margin-bottom: 20px;
      padding: 22px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-size: 1.8rem;
      margin-bottom: 4px;
    }

    .brand p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .top-status-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .sync-status {
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      min-width: 260px;
      border: 1px solid transparent;
    }

    .sync-status.info { background: #e0f2fe; color: #075985; border-color: #bae6fd; }
    .sync-status.success { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .sync-status.warning { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .sync-status.error { background: #fee2e2; color: #991b1b; border-color: #fecaca; }

    .pending-box {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
    }

    .store-card {
      max-width: 500px;
      margin: 40px auto 0;
      padding: 28px;
    }

    .store-card h2, .modal-content h3 {
      margin-bottom: 18px;
    }

    .store-buttons {
      display: grid;
      gap: 12px;
    }

    .main-card { padding: 22px; }

    .main-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .main-top h2 { margin: 0; }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stack-layout {
      display: grid;
      gap: 20px;
    }

    .panel { padding: 18px; }
    .panel h3 { margin-bottom: 14px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .pin-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr auto auto;
      gap: 10px;
      align-items: end;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.93rem;
      font-weight: 600;
      color: #374151;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #fff;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e5e7eb; color: #111827; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-wide { min-width: 180px; }

    .btn-mini {
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--danger);
      color: #fff;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
    }

    .stock-info-box,
    .adjustment-stock-info {
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 600;
    }

    .stock-info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
    }

    .adjustment-stock-info {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      margin-bottom: 12px;
    }

    .summary-box {
      margin-top: 10px;
      padding: 10px
